name: Weekly sync

on:
  schedule:
    - cron: '17 5 * * 1'   # every Monday 05:17 UTC (TravelersBook syncs from Wikipedia at 03:20 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CSV
        run: |
          curl -fsSL --retry 3 --retry-delay 30 \
            -H 'User-Agent: passport-visa-data (https://github.com/Stanlychang/passport-visa-data)' \
            https://travelersbook.app/api/open-data/passport-visa.csv -o data/passport-visa.csv.new
          # 少於 1 萬行 = 來源異常(正常約 4.4 萬行)→ 不覆蓋
          test "$(wc -l < data/passport-visa.csv.new)" -gt 10000
          mv data/passport-visa.csv.new data/passport-visa.csv
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/passport-visa.csv
          git diff --cached --quiet || git commit -m "data: weekly sync $(date -u +%F)"
          git push
